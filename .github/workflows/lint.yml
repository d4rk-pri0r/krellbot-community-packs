name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-catalogue:
    name: validate community pack catalogue
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed catalogue
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: packs-repo
          persist-credentials: false

      - name: Check out pinned Krellbot validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: d4rkpr10r-Labs/krellbot
          ref: 1b454e4cc19dd1f7eb51e00ac09f6e67ce9fc07c
          path: krellbot
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Validate index and every pack
        working-directory: packs-repo
        run: |
          published=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            published=(--published-ref "$GITHUB_SHA")
          fi
          uv run --project ../krellbot --frozen --no-dev --python 3.13 \
            python scripts/build_index.py --validate "${published[@]}"

      - name: Test catalogue rejection cases
        working-directory: packs-repo
        run: |
          uv run --project ../krellbot --frozen --no-dev --python 3.13 \
            python -m unittest discover -s tests -v
